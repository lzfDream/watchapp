# watchapp 软件目录（唯一数据源）
# 字段说明见 catalog/README.md；修改后运行：
#   python scripts/watchapp.py validate
#   python scripts/watchapp.py render
# 生成 catalog/software.md（勿手改生成物）。

schema = 1
updated = "2026-11-05"
source = "toolchain-inventory 2026-11-03 扫描 + tools-config/software.md + 自建容器栈 2026-11-05"

[preferences]
# 个人安装习惯：便携优先；Windows 按领域分目录；开发环境用 WSL。
prefer_portable = true
windows_root = 'D:\software'
windows_layout = 'D:\software\<领域>\<软件>'
dev_environment = "wsl"

